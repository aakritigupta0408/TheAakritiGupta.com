[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# Standalone Paper Trail India site on its own subdomain (same Netlify server).
# Requires adding paperleaks.theaakritigupta.com as a domain alias in Netlify DNS.
[[redirects]]
  force = true
  from = "https://paperleaks.theaakritigupta.com/*"
  status = 200
  to = "/paperleaks/:splat"

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"
