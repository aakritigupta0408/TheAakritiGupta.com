## Render deployment — manages both the static website and the Python AI backend.
## Docs: https://render.com/docs/render-yaml-spec

services:
  # ── Static React SPA ──────────────────────────────────────────────────────
  - type: static
    name: theaakritigupta-web
    buildCommand: npm ci && npm run build:client
    staticPublishPath: dist/spa
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — all paths return index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Vedic Astrology AI — jyotisha mini engine (Python, Docker) ──────────
  # Builds from the private jyotisha repo (branch: deploy). Grant the Render
  # GitHub app access to aakritigupta0408/jyotisha for this to build.
  - type: web
    name: vedic-astro-ai
    runtime: docker
    repo: https://github.com/aakritigupta0408/jyotisha
    branch: deploy
    dockerfilePath: ./Dockerfile
    # "starter" plan ($7/mo) never sleeps. Use "free" for testing (sleeps after 15 min).
    plan: starter
    healthCheckPath: /
    envVars:
      # Set the key in the Render dashboard → Environment. Do NOT hardcode it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # production turns the policy gate (REFUSE/ABSTAIN) on for the public
      # deployment; set JYOTISHA_UNGATED=1 to see raw model behavior instead.
      - key: ENVIRONMENT
        value: production
      - key: JYOTISHA_MODEL
        value: claude-sonnet-4-6
