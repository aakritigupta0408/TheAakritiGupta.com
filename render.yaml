## Render deployment — the Python AI backend only.
## The website itself (React SPA) deploys via GitHub Pages (.github/workflows/
## deploy-pages.yml → gh-pages → www.theaakritigupta.com); Render hosts just
## the vedic-astro-ai engine that the AI-playground page embeds in an iframe.
## Docs: https://render.com/docs/render-yaml-spec

services:
  # ── Vedic Astrology AI — jyotisha mini engine (Python, Docker) ──────────
  # Builds from the private jyotisha repo (branch: deploy). Grant the Render
  # GitHub app access to aakritigupta0408/jyotisha for this to build.
  - type: web
    name: vedic-astro-ai
    runtime: docker
    repo: https://github.com/aakritigupta0408/jyotisha
    branch: deploy
    dockerfilePath: ./Dockerfile
    # "starter" plan ($7/mo) never sleeps. Use "free" for testing (sleeps after 15 min).
    plan: starter
    healthCheckPath: /
    envVars:
      # Set the key in the Render dashboard → Environment. Do NOT hardcode it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # production turns the policy gate (REFUSE/ABSTAIN) on for the public
      # deployment; set JYOTISHA_UNGATED=1 to see raw model behavior instead.
      - key: ENVIRONMENT
        value: production
      - key: JYOTISHA_MODEL
        value: claude-sonnet-4-6
